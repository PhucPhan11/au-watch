# Production stack: the app (one instance) behind Caddy (automatic HTTPS).
# Settings come from .env next to this file (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "3000"
      REFRESH_MINUTES: ${REFRESH_MINUTES:-10}
      USER_AGENT: ${USER_AGENT:-au-watch/0.1}
    volumes:
      - au-watch-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2.11.6
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  au-watch-data:
  caddy-data:
  caddy-config:
